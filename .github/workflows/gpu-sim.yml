name: GPU tests (simulated)

# Optional, non-required check. The runners have no GPU, so this runs the tests
# on a simulated NVIDIA H100 (https://github.com/pantheongpu/pantheonsim).
# A simulator cannot reproduce hardware-specific behaviour or timing, so it
# complements real-GPU testing and does not replace it.

on:
  push:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  gpu-tests:
    name: tests on a simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@dda0c8df8d72627c295edbae525354ba2bcb1687 # v0.1.4
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      - name: Configure
        run: |
          # 90-virtual embeds PTX only: the simulator JIT-compiles PTX and does not run SASS.
          sed -i 's/set(CMAKE_CUDA_ARCHITECTURES 80 90 100)/set(CMAKE_CUDA_ARCHITECTURES 90-virtual)/' CMakeLists.txt
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared \
            -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build -j

      # test_embedding_allocation and test_embedding_against_cpu take more than
      # five minutes on a simulated GPU, so they are left out. So is
      # test_embedding_backward, whose comparisons read reference buffers that
      # are never initialized, so the result depends on what the heap holds.
      - name: Test
        run: |
          for t in test_datagen test_third_party_utils test_embedding_forward \
                   test_embedding_transpose test_embedding_ops; do
            vgpu run ./build/bin/test/$t
          done

      - name: Free disk space
        if: always()
        run: |
          df -h /
          rm -rf build
          df -h /
